<ui-page-shell
  width="narrow"
  [title]="title()"
  [description]="description()"
  [back]="back"
  backTestId="back"
>
  @if (title()) {
    <div class="mt-6 space-y-8">
      <section class="flex flex-wrap items-center gap-4">
        <a uiButton data-testid="start-round" routerLink="round">Start round</a>
        <a uiButton variant="link" data-testid="stats-link" routerLink="stats">Stats</a>
      </section>

      <section class="space-y-2">
        <h2 class="type-section">Progress</h2>
        <ul class="type-body space-y-1">
          <li>
            Rounds played:
            <span data-testid="rounds-played">{{ progress().roundsPlayed ?? '—' }}</span>
          </li>
          <li>
            Accuracy:
            <span data-testid="accuracy">{{ progress().accuracy ?? '—' }}</span>
          </li>
        </ul>
      </section>

      <section class="space-y-2">
        <h2 class="type-section">Deck</h2>
        <ul class="space-y-2">
          @for (concept of deck(); track concept.id) {
            <li data-testid="deck-item" uiCard>
              <p class="type-card">{{ concept.name }}</p>
              <p class="type-detail">{{ concept.shortDefinition }}</p>
            </li>
          }
        </ul>
      </section>
    </div>
  }
</ui-page-shell>
