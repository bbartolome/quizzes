<ui-page-shell width="narrow" [title]="reportTitle()">
  <div class="mt-6 space-y-8">
    @if (empty()) {
      <ui-empty-state
        message="No cards were checked this round, so there is no report yet."
        messageTestId="empty"
      >
        <button
          uiButton
          variant="secondary"
          type="button"
          data-testid="back"
          (click)="back()"
        >
          {{ backLabel() }}
        </button>
      </ui-empty-state>
    } @else {
      <p data-testid="summary" class="type-section">
        {{ summary().n }} of {{ summary().m }} correct
      </p>

      @if (summary().missed.length > 0) {
        <section class="space-y-2">
          <h2 class="type-section">Missed this round</h2>
          <ul data-testid="missed-list" class="space-y-2">
            @for (line of summary().missed; track $index) {
              <li data-testid="missed-line" uiCard>
                {{ line.targetName }} — you picked {{ line.lureName }}
              </li>
            }
          </ul>
        </section>
      } @else {
        <p data-testid="no-misses" class="type-detail">No misses this round.</p>
      }

      <div class="flex flex-wrap gap-3">
        <button uiButton type="button" data-testid="next-round" (click)="nextRound()">
          Next round
        </button>
        <button
          uiButton
          variant="secondary"
          type="button"
          data-testid="back"
          (click)="back()"
        >
          {{ backLabel() }}
        </button>
      </div>
    }
  </div>
</ui-page-shell>
