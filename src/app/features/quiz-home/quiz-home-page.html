<ui-page-shell
  width="wide"
  [title]="entry()?.title ?? ''"
  [description]="entry()?.description"
  [back]="back"
>
  <div class="space-y-6">
    <div class="flex flex-wrap items-center gap-3">
      <a uiButton variant="primary" [routerLink]="['/quiz', id(), 'round']" [queryParams]="roundParams()">
        Start quiz
      </a>
      @if (hasStats()) {
        <a
          uiButton
          variant="secondary"
          [routerLink]="['/quiz', id(), 'round']"
          [queryParams]="weakRoundParams()"
        >
          Weak spots
        </a>
      }
    </div>

    <!-- Filters -->
    <section uiCard aria-label="Round filters" class="space-y-4">
      <div>
        <p class="type-eyebrow">Category</p>
        <div class="mt-2 flex gap-2">
          @for (opt of ['fallacy', 'bias', 'both']; track opt) {
            <button
              type="button"
              uiChip
              [state]="category() === opt ? 'selected' : 'idle'"
              (click)="setCategory(opt)"
              [attr.aria-pressed]="category() === opt ? 'true' : 'false'"
            >
              {{ opt === 'both' ? 'Both' : opt.charAt(0).toUpperCase() + opt.slice(1) }}
            </button>
          }
        </div>
      </div>

      @if (visibleTraits().length > 0) {
        <div>
          <div class="flex items-center justify-between">
            <p class="type-eyebrow">Traits</p>
            @if (traitsSelected().length > 0) {
              <button type="button" uiButton variant="secondary" (click)="clearTraits()">
                Clear selection
              </button>
            }
          </div>
          <div class="mt-2 flex flex-wrap gap-2" role="group" aria-label="Trait multi-select">
            @for (trait of visibleTraits(); track trait.id) {
              <label uiChip [state]="isTraitSelected(trait.id) ? 'selected' : 'idle'">
                <input
                  type="checkbox"
                  class="sr-only"
                  [checked]="isTraitSelected(trait.id)"
                  (change)="toggleTrait(trait.id)"
                  [attr.aria-label]="trait.name"
                />
                {{ trait.name }}
              </label>
            }
          </div>
        </div>
      }
    </section>

    <!-- Glossary and stats links -->
    <div class="flex flex-wrap gap-4">
      <a uiButton variant="link" [routerLink]="['/quiz', id(), 'glossary']">View glossary &rarr;</a>
      <a uiButton variant="link" [routerLink]="['/quiz', id(), 'stats']">Your stats &rarr;</a>
    </div>
  </div>
</ui-page-shell>
