<div class="mx-auto w-full max-w-2xl space-y-8 p-4 sm:p-6">
  <h1 class="text-3xl font-bold tracking-tight text-slate-900">
    {{ quizTitle() }}
  </h1>

  <form class="space-y-8" (ngSubmit)="submit()">
    @for (question of questions(); track question.id) {
      <fieldset
        data-testid="question"
        class="space-y-4 rounded-lg border border-slate-200 bg-white p-4 focus-within:ring-2 focus-within:ring-indigo-500"
      >
        <legend class="px-1 text-base font-semibold text-slate-800">
          {{ question.prompt }}
        </legend>

        @for (option of question.options; track option) {
          <label
            class="flex cursor-pointer items-center gap-3 rounded-md p-2 text-slate-700 hover:bg-slate-50 focus-within:ring-2 focus-within:ring-indigo-500"
          >
            <input
              data-testid="option"
              type="checkbox"
              class="h-5 w-5 rounded border-slate-300 text-indigo-600 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
              [checked]="(selections()[question.id] ?? []).includes(option)"
              (change)="toggle(question.id, option)"
            />
            {{ option }}
          </label>
        }
      </fieldset>
    }

    <div class="flex justify-end">
      <button
        data-testid="submit-round"
        type="submit"
        [disabled]="!canSubmit()"
        class="inline-flex items-center justify-center rounded-md bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300"
      >
        Submit round
      </button>
    </div>
  </form>
</div>
