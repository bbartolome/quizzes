<div class="min-h-screen bg-gray-50 px-4 py-8 sm:px-8">
  <main class="mx-auto max-w-4xl space-y-6">
    @if (loadError()) {
      <app-bank-unavailable (retry)="load()" />
    } @else if (view(); as v) {
      <h1 class="text-3xl font-semibold tracking-tight text-gray-900">
        {{ ctx()!.entry.title }}: results
      </h1>

      <app-calibration-chart
        [format]="v.format"
        [buckets]="v.firstRound ? v.roundBuckets : v.beforeBuckets"
        [overlay]="v.firstRound ? null : v.roundBuckets"
        [firstRound]="v.firstRound"
      />

      <div class="grid gap-4 sm:grid-cols-2">
        <app-skill-score-card
          [format]="v.format"
          [side]="v.round"
          [before]="v.before"
          [delta]="v.delta"
        />
        <app-confidence-card [side]="v.round" [before]="v.before" />
      </div>

      <section class="space-y-4">
        <h2 class="text-xl font-semibold text-gray-900">Item review</h2>
        <app-review-list [sections]="v.sections" />
      </section>

      <a
        [routerLink]="['/calibration', ctx()!.quizId]"
        class="inline-flex items-center gap-1 text-sm font-medium text-blue-700 hover:underline"
        >Back to quiz</a
      >
    }
  </main>
</div>
