<ui-page-shell [title]="title()" width="wide">
  @if (loadError()) {
    <app-bank-unavailable (retry)="load()" />
  } @else if (view(); as v) {
    <div class="space-y-6">
      <app-calibration-chart
        [format]="v.format"
        [buckets]="v.firstRound ? v.roundBuckets : v.beforeBuckets"
        [overlay]="v.firstRound ? null : v.roundBuckets"
        [firstRound]="v.firstRound"
      />

      <div class="grid gap-4 sm:grid-cols-2">
        <app-skill-score-card
          [format]="v.format"
          [side]="v.round"
          [before]="v.before"
          [delta]="v.delta"
        />
        <app-confidence-card [side]="v.round" [before]="v.before" />
      </div>

      <section class="space-y-4">
        <h2 class="type-section">Item review</h2>
        <app-review-list [sections]="v.sections" />
      </section>

      <div class="flex flex-wrap items-center gap-3">
        <a uiButton variant="primary" [routerLink]="['/calibration', ctx()!.quizId, 'round']">
          Next round
        </a>
        <a uiButton variant="secondary" [routerLink]="['/calibration', ctx()!.quizId]">
          Back to quiz
        </a>
      </div>
    </div>
  }
</ui-page-shell>
