<div class="min-h-screen bg-gray-50">
  <main class="mx-auto max-w-3xl space-y-8 px-4 py-10">
    @if (loadError()) {
      <app-bank-unavailable (retry)="load()" />
    } @else if (view(); as v) {
      <h1 class="text-2xl font-semibold">{{ ctx()!.entry.title }}: results</h1>

      <app-calibration-chart
        [format]="v.format"
        [buckets]="v.firstRound ? v.roundBuckets : v.beforeBuckets"
        [overlay]="v.firstRound ? null : v.roundBuckets"
        [firstRound]="v.firstRound"
      />

      <div class="grid gap-4 sm:grid-cols-2">
        <app-skill-score-card
          [format]="v.format"
          [side]="v.round"
          [before]="v.before"
          [delta]="v.delta"
        />
        <app-confidence-card [side]="v.round" [before]="v.before" />
      </div>

      <section class="space-y-4">
        <h2 class="text-xl font-semibold">Item review</h2>
        <app-review-list [sections]="v.sections" />
      </section>

      <a href="#/calibration/{{ ctx()!.quizId }}">Back to quiz</a>
    }
  </main>
</div>
