@if (loadError()) {
  <app-bank-unavailable (retry)="load()" />
} @else {
  @let e = entry();
  @let p = pending();
  @if (e !== null && p !== null && bank() !== null) {
    <ui-page-shell [title]="e.title" [eyebrow]="e.format" width="narrow">
      <div class="flex items-center justify-center">
        <ui-progress-dots
          class="flex flex-wrap items-center justify-center gap-1"
          [count]="p.items.length"
          [current]="index()"
          [answered]="answeredFlags()"
          (select)="goTo($event)"
        />
      </div>

      @let cur = current();
      @if (cur !== null) {
        <p class="type-section mt-6">{{ cur.item.prompt }}</p>
        <div class="mt-4">
          @if (!isFourWay()) {
            <app-bipolar-scale
              [options]="onScreenOptions()!"
              [selected]="selectedTwoWay()"
              (answer)="answerTwoWay($event)"
            />
          } @else {
            <app-four-way-control
              [options]="onScreenOptions()"
              [selected]="selectedFourWay()"
              (change)="answerFourWay($event)"
            />
          }
        </div>
      }

      <div class="mt-8 flex items-center justify-between gap-3">
        <button
          uiButton
          variant="secondary"
          type="button"
          [disabled]="index() <= 0"
          (click)="back()"
        >
          Back
        </button>
        <button
          uiButton
          variant="primary"
          type="button"
          [disabled]="!allAnswered()"
          (click)="submit()"
        >
          Submit round
        </button>
      </div>
    </ui-page-shell>
  }
}
